name: Release

on:
  push:
    tags:
      - "v*.*.*"   # dispara em tags como v0.1.0, v1.2.3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extrair versão da tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Atualizar versão no system.json
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          jq --arg v "$VERSION" '.version = $v' system.json > system.tmp.json
          mv system.tmp.json system.json
          echo "Versão atualizada para $VERSION"

      - name: Instalar dependências
        run: npm install

      - name: Build Compendium Packs
        run: npm run build:packs

      - name: Criar ZIP do sistema
        run: |
          # Empacota somente os arquivos do sistema (sem .git, sem .github, sem node_modules, sem packs-source)
          zip -r sinfonia-das-almas.zip \
            system.json \
            sinfonia.mjs \
            module/ \
            templates/ \
            styles/ \
            lang/ \
            packs/ \
            README.md \
            --exclude "*.DS_Store" \
            --exclude "*Thumbs.db" \
            --exclude "node_modules/*"
          echo "ZIP criado: $(du -sh sinfonia-das-almas.zip)"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Sinfonia das Almas v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Sinfonia das Almas v${{ steps.version.outputs.VERSION }}

            ### Instalação via Manifest
            Cole esta URL no Foundry VTT → Setup → Install System:
            ```
            https://raw.githubusercontent.com/ZeroTrinta/sinfonia-das-almas-system/main/system.json
            ```

            ### Instalação Manual
            Baixe o `sinfonia-das-almas.zip` abaixo e extraia em `{foundryData}/Data/systems/`

            ### Compendiums Incluídos
            - **Armas do Núcleo** (4 armas oficiais)
            - **Magias do Núcleo** (67 magias arcanas e sagradas)
          files: |
            sinfonia-das-almas.zip
            system.json
          draft: false
          prerelease: false
